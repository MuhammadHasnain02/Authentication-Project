<body class="flex flex-col h-screen justify-between">
    
    <!-- ---<<< Registration Section [Authentication, Signup and Signin] >>>--- -->
    
    <div id="authSect" class="flex items-center h-screen justify-center">
        <div class="relative">
            <div class="absolute -top-2 -left-2 -right-2 -bottom-2 rounded-lg bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 shadow-lg animate-pulse"></div>
                <div id="form-container" class="bg-white p-16 rounded-lg shadow-2xl w-100 relative z-10 transform transition duration-500 ease-in-out">
                
                <div class="xl:mx-auto xl:w-full xl:max-w-sm 2xl:max-w-md">
                
                    <h2 class="text-center text-2xl font-bold leading-tight text-black">
                        Sign in to your account</h2>
                    <p class="mt-2 text-center text-[13px] text-gray-600">
                        Don't have an account? Create a free account</p>

                    <form class="mt-8" method="POST" action="#">
                        <div class="space-y-6">

                            <div>
                                <label class="text-base font-medium text-gray-900">
                                    Email address
                                </label>
                                <div class="mt-2">
                                    <input placeholder="Email" type="email" id="userEmail" class="flex h-10 w-full rounded-md border border-gray-300 bg-transparent px-3 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-1 focus:ring-gray-400 focus:ring-offset-1 disabled:cursor-not-allowed disabled:opacity-50"/>
                                </div>
                            </div>

                            <div>
                                <div class="flex items-center justify-between">
                                    <label class="text-base font-medium text-gray-900">
                                        Password
                                    </label>
                                    <a id="forgetPassw" class="text-sm font-semibold text-black hover:underline" title="" href="#">
                                        Forgot password?
                                    </a>
                                </div>
                                <div class="relative mt-2">
                                    <input id="userPassword" placeholder="Password" type="password" class="flex h-10 w-full rounded-md border border-gray-300 bg-transparent px-3 pr-10 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-1 focus:ring-gray-400 focus:ring-offset-1"/>
                                    <i id="changIcon" class="fa-regular fa-eye-slash absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500"></i>
                                </div>
                            </div>

                            <div class="flex flex-row space-x-2">
                                <button id="signupBtn" class="inline-flex w-full items-center justify-center rounded-md bg-black px-3.5 py-2 font-semibold leading-7 text-white hover:cursor-pointer border-2 duration-600 hover:bg-white hover:text-black" type="button">
                                    Signup
                                </button>
                                <button id="loginBtn" class="inline-flex w-full items-center justify-center rounded-md bg-black px-3.5 py-2 font-semibold leading-7 text-white hover:cursor-pointer border-2 duration-600 hover:bg-white hover:text-black" type="button">
                                    Login
                                </button>
                            </div>
                        </div>
                    </form>

                    <div class="mt-3 space-y-3">

                        <button id="signinGoogle" class="relative inline-flex w-full items-center justify-center rounded-md border border-gray-300 bg-white px-3.5 py-2.5 font-semibold text-gray-700 transition-all duration-200 hover:bg-gray-100 hover:cursor-pointer hover:text-black focus:bg-gray-100 focus:text-black focus:outline-none" type="button">
                            <span class="mr-2 inline-block">
                                <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-rose-500">
                                    <path d="M20.283 10.356h-8.327v3.451h4.792c-.446 2.193-2.313 3.453-4.792 3.453a5.27 5.27 0 0 1-5.279-5.28 5.27 5.27 0 0 1 5.279-5.279c1.259 0 2.397.447 3.29 1.178l2.6-2.599c-1.584-1.381-3.615-2.233-5.89-2.233a8.908 8.908 0 0 0-8.934 8.934 8.907 8.907 0 0 0 8.934 8.934c4.467 0 8.529-3.249 8.529-8.934 0-.528-.081-1.097-.202-1.625z"></path>
                                </svg>
                            </span>
                            Sign in with Google
                        </button>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ---<<< Main Section >>>--- -->
    <section id="mainSect" class="flex flex-col h-screen justify-between">

        <header class="">header</header>
        <section class="">section 1</section>
        <section class="">section 2</section>
        <footer class="">footer</footer>

    </section>


    <!-- Toast Notification Div -->
    <div id="toastDiv" class=""></div>
